[project]
name = "arabic-tts-prototype"
version = "0.1.0"
description = "Python-first Arabic text-to-speech prototype with provider abstraction, streaming, and latency instrumentation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "edge-tts>=7.0",
    "huggingface_hub>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
# Local MPS/CPU execution for the small Hugging Face models research.md R11
# clears for it (dialect classifier, diacritizer, G2P) — NOT required for the
# hosted-Inference-API-first default path (R12), so this stays optional and
# the credential-free Edge-only install keeps installing fast (T119).
huggingface-local = [
    "torch>=2.4",
    "transformers>=4.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
markers = [
    "integration: live provider tests requiring credentials (skipped when absent)",
]
filterwarnings = ["ignore::DeprecationWarning"]
