[project]
name = "saudi-tts-prototype"
version = "0.2.0"
description = "Python-first Saudi Arabic text-to-speech prototype (male/female voices, latency measurement)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
markers = [
    "integration: live provider tests requiring credentials (skipped when absent)",
]
filterwarnings = ["ignore::DeprecationWarning"]
